# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Pinned version: 0.14.2
# Helm release name "sozu-bench" IS the runs-on label: runs-on: sozu-bench
#
# Isolation mechanism (per design, refined during planning): the `bench` NodeGroup gives every
# bench job its own dedicated node — no other pod is ever co-scheduled — which is what actually
# buys bench reproducibility (Heracles ISCA 2015: cgroup/QoS isolation alone is insufficient
# against LLC/DRAM-bandwidth interference; only physical node exclusivity holds). Autoscaling is
# explicitly disabled (clever k8s nodegroups create silently inherits the cluster's autoscaling
# setting — a nodegroups update --disable-autoscaling was required after creation, see
# ci/runners/runbook.md).
#
# Redesigned 2026-09-24 (see values-general.yaml for the full investigation): node flavor switched
# XL -> S (8 vCPU / 12Gi) as part of a cluster-wide move to a uniform 1 job = 1 pod = 1 node model
# for BOTH pools — `general` used to pack 2 pods/XL-node, which turned out to be unsafe (real free
# disk on an XL node is only ~15Gi once the base OS/containerd footprint is accounted for, not the
# ~35Gi kubelet advertises). `bench` was already 1:1, so this redesign only changes its flavor and
# node count, not its isolation model. Node count initially set to 1.5x a single PR's real
# bench-job fan-out (4 concurrent sozu-bench jobs per PR push, from ci.yml's job graph:
# crypto-ring/aws-lc-rs/openssl/fips) = 4 x 1.5 = 6 nodes, then doubled to 12 the same day once
# real usage showed 6 was too slow — jobs were queueing behind the fixed pool while `general`
# kept pace, confirming demand exceeded the 1.5x estimate. maxRunners capped at 12 to match 1:1.
# The resources.requests
# below reserve nearly the entire S node (7 vCPU / 10Gi, ~1 vCPU / ~1.2Gi headroom for daemonsets —
# same sizing as values-general.yaml, since both pools now share the same near-whole-node
# methodology), so no other pod can ever be co-scheduled regardless of nodeSelector correctness
# elsewhere. Trade-off accepted explicitly: absolute per-job compute drops from XL's 16vCPU/30Gi
# to S's 8vCPU/12Gi, so historical Criterion baselines gathered on XL are not directly comparable
# to numbers gathered after this change — run-to-run reproducibility (the actual guarantee this
# isolation buys) is unaffected, since every bench job still gets a fully dedicated node.
#
# Fork-PR exposure and pod hardening notes: same as values-general.yaml — see there for the full
# rationale (ephemeral pods + Task 10's repo setting as the fork-PR gate; digest pin + safe
# securityContext subset applied 2026-09-22 per automated security review; readOnlyRootFilesystem
# and automountServiceAccountToken:false deliberately deferred, not silently skipped).
#
# hostAliases: same CoreDNS-reliability root cause as values-general.yaml (see there for the full
# investigation) — the bench cells run the identical e2e suite (bench only gates the separate
# Criterion step), so they hit the exact same three-hostname DNS dependency.
#
# hostAliases, sozu.io block (2026-09-23, bench-bombardier migration): replaces that job's former
# "Host mapping sozu.io domains" step, which did `sudo tee -a /etc/hosts` — same 0.0.0.0 target,
# same NSS "files" mechanism, just applied at the pod level instead of at runtime with root.
githubConfigUrl: "https://github.com/sozu-proxy/sozu"
githubConfigSecret: sozu-runner-github-app

minRunners: 0
maxRunners: 12

template:
  spec:
    hostAliases:
      - ip: "127.0.0.1"
        hostnames:
          - "cluster-a.localhost"
          - "cluster-b.localhost"
          - "other.localhost"
      - ip: "0.0.0.0"
        hostnames:
          - "sozu.io"
          - "rsa-2048.sozu.io"
          - "rsa-4096.sozu.io"
          - "ecdsa.sozu.io"
    nodeSelector:
      clever-cloud.com/nodegroup: bench
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: clevercloud/sozu-ci-runner@sha256:ced2e7e53baecea7d44c610502ed83976d0880adf650600d7def9196fc06af21
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "7"
            memory: "10Gi"
