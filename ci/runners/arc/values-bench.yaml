# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Pinned version: 0.14.2
# Helm release name "sozu-bench" IS the runs-on label: runs-on: sozu-bench
#
# Isolation mechanism (per design, refined during planning): every bench job gets its own
# dedicated node through the resources.requests below (see "No nodeSelector") — no other pod is
# ever co-scheduled — which is what actually buys bench reproducibility (Heracles ISCA 2015: cgroup/QoS isolation alone is insufficient
# against LLC/DRAM-bandwidth interference; only physical node exclusivity holds). Autoscaling is
# explicitly disabled (clever k8s nodegroups create silently inherits the cluster's autoscaling
# setting — a nodegroups update --disable-autoscaling was required after creation, see
# ci/runners/runbook.md).
#
# Redesigned 2026-09-24 (see values-general.yaml for the full investigation): node flavor switched
# XL -> S (8 vCPU / 12Gi) as part of a cluster-wide move to a uniform 1 job = 1 pod = 1 node model
# for BOTH pools — `general` used to pack 2 pods/XL-node, which turned out to be unsafe (real free
# disk on an XL node is only ~15Gi once the base OS/containerd footprint is accounted for, not the
# ~35Gi kubelet advertises). `bench` was already 1:1, so this redesign only changes its flavor and
# node count, not its isolation model. Node count initially set to 1.5x a single PR's real
# bench-job fan-out (4 concurrent sozu-bench jobs per PR push, from ci.yml's job graph:
# crypto-ring/aws-lc-rs/openssl/fips) = 4 x 1.5 = 6 nodes, then doubled to 12 the same day once
# real usage showed 6 was too slow — jobs were queueing behind the fixed pool while `general`
# kept pace, confirming demand exceeded the 1.5x estimate. maxRunners capped at 12 to match 1:1.
#
# Reconciled against the live release 2026-09-24: `helm get values sozu-bench -n arc-runners`
# reports maxRunners 18, and the `bench` nodegroup carries 28 nodes — both raised outside git
# after the paragraph above was written, so the tracked 12 would have SHRUNK the pool by a third
# on the next `helm upgrade`. maxRunners below now states the deployed 18. Every other deployed
# value already matched this file byte-for-byte. The nodegroup node count is not a chart value
# (it is managed with `clever k8s nodegroups`), so the 6 -> 12 prose above is kept as the
# historical record and 28 is the count observed live on 2026-09-24. Note that 18 runners against
# 28 nodes is no longer the strict 1:1 the sentence above describes: the pool cannot fill its own
# nodegroup, and 10 bench nodes can never receive a runner. Whether that is deliberate headroom or
# a second, opposite drift is an operator call, so it is recorded here rather than guessed at —
# raising maxRunners to 28 would be a capacity decision, not part of this disk fix.
# The resources.requests
# below reserve nearly the entire S node (7 vCPU / 10Gi, ~1 vCPU / ~1.2Gi headroom for daemonsets —
# same sizing as values-general.yaml, since both pools now share the same near-whole-node
# methodology), so no other pod can ever be co-scheduled regardless of nodeSelector correctness
# elsewhere. Trade-off accepted explicitly: absolute per-job compute drops from XL's 16vCPU/30Gi
# to S's 8vCPU/12Gi, so historical Criterion baselines gathered on XL are not directly comparable
# to numbers gathered after this change — run-to-run reproducibility (the actual guarantee this
# isolation buys) is unaffected, since every bench job still gets a fully dedicated node.
#
# Fork-PR exposure and pod hardening notes: same as values-general.yaml — see there for the full
# rationale (ephemeral pods + Task 10's repo setting as the fork-PR gate; digest pin + safe
# securityContext subset applied 2026-09-22 per automated security review; readOnlyRootFilesystem
# and automountServiceAccountToken:false deliberately deferred, not silently skipped).
#
# hostAliases: same CoreDNS-reliability root cause as values-general.yaml (see there for the full
# investigation) — the bench cells run the identical e2e suite (bench only gates the separate
# Criterion step), so they hit the exact same three-hostname DNS dependency.
#
# hostAliases, sozu.io block (2026-09-23, bench-bombardier migration): replaces that job's former
# "Host mapping sozu.io domains" step, which did `sudo tee -a /etc/hosts` — same 0.0.0.0 target,
# same NSS "files" mechanism, just applied at the pod level instead of at runtime with root.
#
# ephemeral-storage request/limit (2026-09-24) — THE INCIDENT THIS POOL PRODUCED. Jobs were dying
# roughly five minutes in with "Process completed with exit code 130" and "The operation was
# canceled", or "The self-hosted runner lost communication with the server", while sibling matrix
# cells kept running (`fail-fast: false`) and `timeout-minutes: 60` was never approached. The full
# chain, reconstructed from `kubectl get events` correlated with the failed job's own runner name:
#
#   10:13:33Z  Scheduled  pod sozu-bench-jzs82-runner-5v2hr -> bench-node28
#   10:13:34Z  Started    container runner
#   10:13:38Z  (GitHub)   crypto-openssl begins on runner sozu-bench-jzs82-runner-5v2hr
#   10:16:40Z  EvictionThresholdMet  bench-node28  "Attempting to reclaim ephemeral-storage"
#   10:16:41Z  NodeHasDiskPressure   bench-node28
#   10:18:33Z  Killing    pod sozu-bench-jzs82-runner-5v2hr  "Stopping container runner"
#   10:18:34Z  NodeNotSchedulable    bench-node28
#   10:18:37Z  (GitHub)   crypto-openssl recorded `failure` — 4m59s of a 60m budget
#   10:18:43Z  RemovingNode          bench-node28   (node recycled, kubelet restarts 10:23:09Z)
#
# (run 35985966643 attempt 1, PR #1502.) Note what is ABSENT from that chain: there is no
# `Evicted` event on the pod. Under node-level disk pressure the node itself is reclaimed and
# recycled, so the runner simply stops talking to GitHub and the job is reported as a generic
# cancellation — nothing on either side names ephemeral-storage as the cause. That silence is why
# this kept being read as a flaky test rather than a disk problem.
#
# Why a LIMIT and not just a request: without a limit, one overrunning job takes the whole node
# into DiskPressure and kubelet reclaims *something* — producing exactly the unattributable exit
# 130 above, on whichever pod happens to lose. With a limit, kubelet kills the one offending pod
# with an explicit "exceeded ephemeral-storage limit" naming the culprit, and nothing else on the
# node is disturbed. Converting a mysterious cancellation into a named, attributable failure is
# most of what this change buys; it does not manufacture disk that is not there — see the sizing
# arithmetic and the node-resize recommendation in values-general.yaml, which apply unchanged to
# this pool since both nodegroups run the identical S flavor (verified: same 8 vCPU, same
# 11283432Ki memory, same 37759323279 ephemeral-storage allocatable on a 42.0GB device).
#
# The request is NOT a scheduling guard (values-general.yaml explains why kubelet's advertised
# allocatable makes it useless as one); it is set equal to the limit only so the declared intent
# shows up in `kubectl describe node`. It costs no concurrency here: cpu 7 + 0.28 for the node's
# system pods = 7.28 of 8 allocatable already makes a second runner unschedulable, verified
# against the live distribution of 11 running runners across 11 distinct nodes.
# No nodeSelector (2026-09-25): bench pods are no longer pinned to the `bench` nodegroup and may
# land on any node of the cluster, `default` included. Whole-node exclusivity is unaffected: it
# never came from the selector but from the resources.requests below (cpu 7 + 0.28 system = 7.28
# of 8), and both nodegroups run the identical S flavor, so a bench job still gets a fully
# dedicated node of the same shape. What is lost is only the separation between the two pools'
# capacity: general and bench runners now draw from the same set of nodes.
githubConfigUrl: "https://github.com/sozu-proxy/sozu"
githubConfigSecret: sozu-runner-github-app

minRunners: 0
maxRunners: 18

template:
  spec:
    hostAliases:
      - ip: "127.0.0.1"
        hostnames:
          - "cluster-a.localhost"
          - "cluster-b.localhost"
          - "other.localhost"
      - ip: "0.0.0.0"
        hostnames:
          - "sozu.io"
          - "rsa-2048.sozu.io"
          - "rsa-4096.sozu.io"
          - "ecdsa.sozu.io"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: runner
        image: clevercloud/sozu-ci-runner@sha256:ced2e7e53baecea7d44c610502ed83976d0880adf650600d7def9196fc06af21
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "7"
            memory: "10Gi"
            # 8Gi against ~9.7GB of real usable headroom, measured peak 7.0GB — see the block
            # above and the arithmetic in values-general.yaml. Request mirrors the limit for
            # visibility only; CPU is what enforces 1 pod = 1 node.
            ephemeral-storage: "8Gi"
          limits:
            # The half that makes a failure attributable: the pod is killed naming its own limit
            # instead of the node going into DiskPressure and taking an unnamed victim.
            ephemeral-storage: "8Gi"
