syntax = "proto3";

package sozu.e2e.lifecycle;

service LifecycleStore {
  rpc Put(PutRequest) returns (ValueReply);
  rpc Get(GetRequest) returns (ValueReply);
  rpc Exchange(stream StreamChunk) returns (stream StreamChunk);
  rpc Wait(WaitRequest) returns (ValueReply);
}

message PutRequest {
  string operation_id = 1;
  string key = 2;
  bytes value = 3;
}

message GetRequest {
  string key = 1;
}

message ValueReply {
  string operation_id = 1;
  string key = 2;
  bytes value = 3;
  uint64 invocation_count = 4;
}

message StreamChunk {
  uint32 sequence = 1;
  bytes payload = 2;
  string sha256 = 3;
}

message WaitRequest {
  string key = 1;
}
