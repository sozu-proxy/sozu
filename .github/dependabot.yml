version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # `dtolnay/rust-toolchain@<ref>` names the Rust toolchain to install, not
      # an action release. Dependabot reads that ref as a version and bumps it:
      # on 2026-09-20 it proposed `@1.120.0`, a Rust release that does not
      # exist, and four jobs died on `could not download nonexistent rust
      # version 1.120.0-x86_64-unknown-linux-gnu`. Had the version existed, the
      # bump would instead have silently raised the MSRV that `rust-toolchain`
      # pins to 1.93.1, with no test able to notice. Raise the MSRV by editing
      # `rust-toolchain` and every workflow pin together.
      - dependency-name: dtolnay/rust-toolchain
    open-pull-requests-limit: 5
