---
name: Simulation sweep

# Deterministic-simulation seed swarms (moonpool-sim engine, sozu-sim crate) —
# the sans-io UDP core AND the TCP passthrough SNI-preread core
# (sozu-proxy/sozu#1279) — plus extended fuzzing, in the spirit of FoundationDB's
# nightly runs. Per-PR CI runs a modest sweep of both simulations (the
# `udp-simulation` job in ci.yml) + 300s/target fuzzing; this workflow widens all
# of it.
#
# Every `(commit, seed)` pair is reproducible, so a failing seed printed here
# replays locally with:
#   RUSTFLAGS="--cfg tokio_unstable" SOZU_UDP_SIM_SEED=<seed> \
#     cargo test -p sozu-sim --test udp_simulation -- --nocapture
# or, for the TCP preread sim:
#   RUSTFLAGS="--cfg tokio_unstable" SOZU_TCP_PREREAD_SIM_SEED=<seed> \
#     cargo test -p sozu-sim --test tcp_preread_sim -- --nocapture
# See doc/testing.md and doc/udp_simulation.md.

on:
  schedule:
    # Daily at 03:17 UTC (quiet window; offset off the hour).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of seeds to sweep (SOZU_UDP_SIM_SEEDS)'
        required: false
        # moonpool builds a fresh tokio runtime per seed (~100x slower per
        # seed-step than a pure loop), so the deep swarm is seed-bounded to fit
        # the 45-min cap rather than the old handmade 4096x20000.
        default: '1024'
      steps:
        description: 'Steps per seed (SOZU_UDP_SIM_STEPS)'
        required: false
        default: '3000'
      tcp_preread_seeds:
        description: 'Number of seeds to sweep (SOZU_TCP_PREREAD_SIM_SEEDS)'
        required: false
        # tcp_preread_sim has no per-seed tokio runtime (SniPrereadCore is a
        # small, near-stateless per-connection state machine), so it is far
        # cheaper per seed than the UDP sim — a locally measured 2048 seeds ×
        # 200 connections/seed ran in ~14s, so the nightly swarm can go wider.
        default: '4096'
      tcp_preread_steps:
        description: 'Connections per seed (SOZU_TCP_PREREAD_SIM_STEPS)'
        required: false
        default: '256'
      fuzz_seconds:
        description: 'Seconds per fuzz target'
        required: false
        default: '900'

env:
  CARGO_TERM_COLOR: always

# Never cancel a sweep in flight; let scheduled runs complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ┌──────────────────────────────────────────────────────────────┐
  # │ Deterministic-simulation seed swarm over the sans-io UDP core │
  # │   via the moonpool-sim engine (sozu-sim crate). Debug build   │
  # │   is REQUIRED: the TigerStyle `debug_assert!` invariants are  │
  # │   compiled out in release. `--cfg tokio_unstable` is scoped    │
  # │   here via RUSTFLAGS (moonpool's tokio RngSeed determinism) —  │
  # │   NOT workspace-wide; the cfg-gated deps keep the per-PR       │
  # │   `cargo test --workspace` flag-free.                          │
  # └──────────────────────────────────────────────────────────────┘
  udp-simulation-sweep:
    name: UDP simulation seed sweep (moonpool-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Inputs are exposed as env vars (the safe pattern); the test parses them
    # and falls back to its built-in defaults on anything non-numeric.
    env:
      RUSTFLAGS: '--cfg tokio_unstable'
      SOZU_UDP_SIM_SEEDS: ${{ github.event.inputs.seeds || '1024' }}
      SOZU_UDP_SIM_STEPS: ${{ github.event.inputs.steps || '3000' }}
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache cargo target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-all-crates: true
          prefix-key: sim-sweep
          workspaces: . -> target/

      # Debug profile on purpose: the simulator's power is the embedded
      # `debug_assert!` invariant sweep inside the sans-io core, which a
      # release build would strip. A failing seed is printed by the test.
      - name: UDP simulation sweep (debug, asserts live)
        run: cargo test -p sozu-sim --locked --test udp_simulation -- --nocapture

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Deterministic-simulation seed swarm over the TCP passthrough  │
  # │   SNI-preread core (sozu-proxy/sozu#1279) via moonpool-sim     │
  # │   (sozu-sim crate). Debug build is REQUIRED for the same       │
  # │   reason as the UDP sweep above. Unlike the UDP core,          │
  # │   `SniPrereadCore` has no per-seed tokio runtime overhead      │
  # │   (it's a small, near-stateless per-connection state machine), │
  # │   so this swarm can go wider for the same wall-clock budget.  │
  # └──────────────────────────────────────────────────────────────┘
  tcp-preread-simulation-sweep:
    name: TCP preread simulation seed sweep (moonpool-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Inputs are exposed as env vars (the safe pattern); the test parses them
    # and falls back to its built-in defaults on anything non-numeric.
    env:
      RUSTFLAGS: '--cfg tokio_unstable'
      SOZU_TCP_PREREAD_SIM_SEEDS: ${{ github.event.inputs.tcp_preread_seeds || '4096' }}
      SOZU_TCP_PREREAD_SIM_STEPS: ${{ github.event.inputs.tcp_preread_steps || '256' }}
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache cargo target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-all-crates: true
          prefix-key: sim-sweep-tcp-preread
          workspaces: . -> target/

      # Debug profile on purpose: same rationale as the UDP sweep above.
      - name: TCP preread simulation sweep (debug, asserts live)
        run: cargo test -p sozu-sim --locked --test tcp_preread_sim -- --nocapture

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Extended fuzzing — longer than the per-PR 300s budget.        │
  # └──────────────────────────────────────────────────────────────┘
  extended-fuzz:
    name: Extended fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_frame_parser, fuzz_hpack_decoder, fuzz_udp_flow, fuzz_tcp_clienthello]
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '900' }}
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          cache-all-crates: true
          prefix-key: sim-sweep-fuzz
          workspaces: . -> target/

      # `+nightly` is REQUIRED here: the repo's `rust-toolchain` file pins
      # 1.93.1, and that directory override beats the nightly default installed
      # above. Without the explicit toolchain, `cargo install` runs under 1.93.1
      # and cargo-fuzz's locked dep tree (cargo-platform 0.3.3, rust-version
      # 1.91) fails the MSRV gate. The fuzz step below uses `cargo +nightly`.
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time="$FUZZ_SECONDS"

      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 14
