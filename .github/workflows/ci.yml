---
name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debug-info budget, CI-only. Runner pods carry an 8Gi (8.590GB)
  # `ephemeral-storage` limit, and sampling every runner pod through kubelet's
  # `stats/summary` every 50s measured a `sozu-bench` cell sustaining 7.90GB
  # and touching 8.523GB in a single sample -- 67MB, 0.8%, below the limit.
  # The spike is real disk and not a stats artefact: the node's own
  # `available` fell 1.00GB over the same interval and recovered with it. A
  # node offers ~10.1GB before kubelet's `imagefs.available: 15%` eviction
  # floor, and the limit is enforced on the instantaneous figure, so a 1GB
  # transient is what decides whether a job survives.
  #
  # Rust debug info is the largest reducible term in `target/`, and it is
  # capped here in workflow environment rather than in `Cargo.toml`:
  # `[profile.release] debug = true` stays exactly as it is for local
  # profiling and flamegraph work, and `release.yml` publishes its artefacts
  # unchanged. The dev/test profile is built by all nine `pipeline` cells and
  # by `udp-simulation`; the release profile by the four `bench: true` cells,
  # the four `build-sozu` cells, `build-lagging_server`, `build-bench-logger`
  # and the two `cargo install` steps. `cargo fuzz run` is unaffected either
  # way -- see the note on `line-tables-only` below.
  #
  # Measured on 1.93.1 with CARGO_INCREMENTAL=0 (rust-cache exports it
  # unconditionally), a scratch CARGO_TARGET_DIR and `du -sb`:
  #   dev/test, crypto-ring cell flags:  4.275GB -> 2.836GB  (-1.439GB, -34%)
  #   bench,    crypto-ring cell flags:  1.208GB -> 0.944GB  (-264MB,   -22%)
  #   build-sozu, jemallocator+crypto-ring:
  #                                      1.493GB -> 1.276GB  (-217MB,   -15%)
  #                       and the binary it uploads, 162MB -> 65MB
  #
  # `line-tables-only` and not `false`: it keeps `.debug_line` nearly whole
  # (14.24MB -> 13.44MB on the sozu-lib test binary) while dropping most of
  # `.debug_info` (45.64MB -> 6.94MB), so panic frames keep function, file and
  # line. It is also the exact value cargo-fuzz pins for its own builds --
  # `--config profile.release.debug="line-tables-only"`, which both makes the
  # `fuzz` job's `cargo fuzz run` independent of this setting and records
  # upstream's judgement on the floor that keeps libFuzzer crash frames
  # readable. `debug = false` emits no `.debug_*` section at all.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

# Cancel superseded PR runs only. `main` pushes and tag pushes are
# preserved so artefacts produced under one SHA aren't lost when a
# newer push lands (and release tags must complete).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group B — per-cell pipeline                                   │
  # │   build → fmt(msrv) → doc(msrv) → lint(1.91) → test → bench   │
  # └──────────────────────────────────────────────────────────────┘
  pipeline:
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `msrv-full` cell: full feature matrix (opentelemetry + splice
          # + simd on top of default jemallocator). Hosts the
          # workspace-wide fmt + doc steps; no bench. `msrv-bare` below
          # is the bare-default baseline for feature-off breakage.
          - cell: msrv-full
            toolchain: '1.93.1'
            flags: '--features opentelemetry,splice,simd'
            bench: false
            experimental: false
            runner: sozu-general
          # `msrv-bare` baseline: only the workspace defaults
          # (`jemallocator + crypto-ring`). Catches breakage when the
          # optional features (`opentelemetry`, `splice`, `simd`) are
          # *off* and only the default-features path is built. Mirrors
          # `cargo install sozu` for a fresh user install.
          - cell: msrv-bare
            toolchain: '1.93.1'
            flags: ''
            bench: false
            experimental: false
            runner: sozu-general
          # The four crypto-provider cells now exercise the full
          # feature matrix (`<crypto>,opentelemetry,splice,simd`) so
          # the CI cells reflect what release artefacts ship with
          # (matches the feature flags the published Docker image is
          # built with). `--no-default-features` explicitly excludes
          # `jemallocator` (the binary feature) because the lib-only
          # test runs do not link the bin crate.
          - cell: crypto-ring
            toolchain: '1.93.1'
            flags: '--no-default-features --features crypto-ring,opentelemetry,splice,simd'
            bench: true
            experimental: false
            runner: sozu-bench
          - cell: crypto-aws-lc-rs
            toolchain: '1.93.1'
            flags: '--no-default-features --features crypto-aws-lc-rs,opentelemetry,splice,simd'
            bench: true
            experimental: false
            runner: sozu-bench
          - cell: crypto-openssl
            toolchain: '1.93.1'
            flags: '--no-default-features --features crypto-openssl,opentelemetry,splice,simd'
            bench: true
            experimental: false
            runner: sozu-bench
          - cell: fips
            toolchain: '1.93.1'
            flags: '--no-default-features --features fips,opentelemetry,splice,simd'
            bench: true
            experimental: false
            runner: sozu-bench
          # Toolchain-drift cells: same politics as msrv (default
          # features, no bench). Lint is gated to the 1.91 MSRV cell
          # because newer toolchains (1.95+) fire additional untriaged
          # lints across the workspace.
          # Full-matrix migration to the self-hosted CKE runners (see ci/runners/) completed
          # 2026-09-23, after the `stable` canary (PR #1455) proved stable. Compile-only cells
          # (no bench) run on sozu-general; the four crypto-provider cells above run on
          # sozu-bench for physical-node reproducibility.
          - cell: stable
            toolchain: stable
            flags: ''
            bench: false
            experimental: false
            runner: sozu-general
          - cell: beta
            toolchain: beta
            flags: ''
            bench: false
            experimental: false
            runner: sozu-general
          # Nightly stays "experimental" — keep building/testing it
          # to catch future-Rust regressions early without gating CI.
          - cell: nightly
            toolchain: nightly
            flags: ''
            bench: false
            experimental: true
            runner: sozu-general
    steps:
      # protobuf-compiler/cmake/h2spec no longer need an install step here: every `pipeline`
      # cell now runs on a self-hosted sozu-general/sozu-bench pod, and ci/runners/Dockerfile
      # already bakes all three in (h2spec 2.6.0). Removed 2026-09-23 with the full-matrix
      # migration — see ci/runners/README.md.
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      # rustfmt.toml uses the unstable `ignore = [...]` key, so the
      # format check must run on nightly. Only the msrv-full cell
      # hosts the fmt step (provider-agnostic, single run is enough).
      - name: Install nightly rustfmt (msrv-full cell only)
        if: matrix.cell == 'msrv-full'
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rustfmt --toolchain nightly

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: ci-${{ matrix.cell }}

      - name: Build
        run: cargo build --locked ${{ matrix.flags }}

      # Format and doc both run only on the msrv-full cell to avoid
      # repeating provider-agnostic checks 5+ times in the matrix.
      - name: Format check
        if: matrix.cell == 'msrv-full'
        run: cargo +nightly fmt --all -- --check

      # `RUSTDOCFLAGS: -D warnings` is what makes this step a gate instead
      # of a report. Without it rustdoc's diagnostics are emitted and then
      # discarded by a green run: sozu#1482 took this exact command from 76
      # warnings to 0, and every one of those 76 had been printed by a run
      # that passed.
      #
      # What it guards: broken and private intra-doc links, bare URLs,
      # redundant explicit links and invalid HTML in doc comments. The
      # dominant form here is a `pub fn` whose docs link a target the reader
      # cannot reach — `ConnectionH2` is publicly re-exported out of the
      # private `mux::h2` module, so documentation on its public methods
      # (`readable`) that links `Self::handle_read`, a private `fn`, is a
      # `private_intra_doc_links` warning.
      #
      # Why a CLEAN merge reintroduces them: those fixes are doc-comment
      # rewrites, so a branch forked before #1482 still carries the old
      # text. On a hunk the other side never touched, git keeps the
      # rewriting side — so the old links come back with ZERO conflicts and
      # nothing for a reviewer to look at. Four branches forked before
      # #1482 and touching `mux::h2` were each found to revert its fixes
      # that way. Measured on one of them with `git merge-tree`, 13 links
      # come back, naming `Self::handle_read`,
      # `Self::flush_pending_control_frames`, `Self::poll_read_target`,
      # `Self::enqueue_rst`, `Mux`, `h2_control_tx::H2ControlTx` and
      # `h2_stream_table::H2StreamTable::collect_timed_out`. Every job on
      # every one of them was green, because a warning is not a failure.
      #
      # Scope is deliberate on two axes. The `env:` is step-level, not
      # job-wide: `cargo test` runs doctests through rustdoc, so a job-wide
      # value would also gate the four test steps below. And the command is
      # left byte-identical to what CI already ran:
      # `--document-private-items` documents a far larger population and is
      # NOT gated here.
      - name: Build documentation
        if: matrix.cell == 'msrv-full'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

      # Lint runs on the 1.93.1 MSRV cell so feature-specific lints
      # (e.g. only firing under `--features fips`) get caught.
      # Excluded on stable/beta/nightly because 1.95+ fires
      # `mismatched_lifetime_syntaxes` and a handful of other new
      # lints that have not been triaged across the workspace.
      - name: Lint (clippy)
        if: matrix.toolchain == '1.93.1'
        run: cargo clippy --all-targets --locked ${{ matrix.flags }} -- -D warnings

      # `sozu-command-lib` was named in no workflow at all until this step:
      # CI tested `sozu-lib`, `sozu`, `sozu-e2e` and `sozu-sim`, and there is
      # no `cargo test --workspace` anywhere, so `command/`'s 170 `#[test]`
      # functions across 13 files never ran (sozu#1539). They pass — this was
      # never a quarantine anyone chose, the package was simply never added,
      # and nothing reported its absence. The same gap was closed twice before,
      # package by package, for the crates the fix at hand was about (the
      # `Test sozu` and process-level e2e comments below record both); the
      # command lib was in scope neither time.
      #
      # It guards the configuration parser and validator, the protobuf
      # request/response types, `Channel` and the state model that `sozu-lib`
      # and `sozu` are both built on, plus `tests/state_compat_v1_1_1.rs` —
      # a forward-compat regression pinning the `SaveState` / `LoadState` JSON
      # contract that `proxy-manager` and other tools pinned to
      # `sozu-command-lib = "1.1.1"` still write. A break there reaches CI today
      # only if some other package's test happens to exercise it sideways.
      #
      # Gated to one cell rather than run per crypto provider, and carrying no
      # `${{ matrix.flags }}`. Both follow from the same measurement:
      # `command/src/` contains ZERO `cfg(feature)` — its only features
      # (`unstable`, `logs-debug`, `logs-trace`) are empty markers and it has no
      # crypto-provider feature at all, so nothing in it varies by matrix cell
      # and four cells would re-run one identical result four times. The flags
      # are not merely redundant but rejected: `cargo test -p sozu-command-lib
      # --no-default-features --features crypto-ring,opentelemetry,splice,simd`
      # fails with "the package 'sozu-command-lib' does not contain these
      # features". `--locked` and `--verbose` match the neighbouring test steps
      # so a dependency drift fails here exactly as it fails there.
      - name: Test sozu-command-lib
        if: matrix.cell == 'msrv-full'
        run: cargo test -p sozu-command-lib --locked --verbose

      - name: Test sozu-lib
        run: cargo test -p sozu-lib --locked ${{ matrix.flags }} --verbose

      # The `sozu` binary crate carries the master-side command-server unit
      # tests (command/requests.rs, command/server.rs): the rollback, response
      # accounting and channel backpressure guarantees of sozu#1301/#1313/#1314
      # live there and were never exercised by CI. The `#[ignore]`d
      # `bin/tests/*_e2e.rs` process-level tests still stay out (they spawn a
      # real master); run them manually with `-- --ignored`.
      - name: Test sozu
        run: cargo test -p sozu --locked ${{ matrix.flags }} --verbose

      # The `sozu top` unit tests — `bin/src/ctl/top/`, including the insta
      # snapshots of every pane — are `#[cfg(feature = "tui")]`, and no matrix
      # cell's flags enable that feature, so the step above compiles them out.
      # A pane snapshot went stale unnoticed that way (sozu#1576). They run
      # on the `msrv-full` cell only: that cell already resolves the `tui`
      # dependencies for `cargo doc --all-features`, nothing in `top` varies by
      # crypto provider, and `--lib` keeps the extra cost to one build of the
      # `sozu` library test binary.
      - name: Test sozu top (unit and snapshot tests)
        if: matrix.cell == 'msrv-full'
        run: cargo test -p sozu --locked ${{ matrix.flags }} --features tui --lib --verbose

      # The `bin/tests/*_e2e.rs` process-level tests spawn a real master (and
      # for the replay suite a real worker) over a unix socket in a temp dir,
      # and bind ephemeral loopback ports. No root, no fixed port, no TTY — a
      # GitHub runner serves them fine. They stay `#[ignore]`d so a
      # contributor's `cargo test` stays fast, and this step is what runs them;
      # before it existed they never ran anywhere. `sozu_top_e2e` is absent
      # here: it is `#![cfg(feature = "tui")]` and no matrix cell's flags
      # enable that feature, so its target compiles to an empty binary. The
      # next step runs it.
      - name: Test sozu (process-level e2e)
        run: |
          cargo test -p sozu --locked ${{ matrix.flags }} --test load_state_rollback_e2e -- --ignored
          cargo test -p sozu --locked ${{ matrix.flags }} --test frontend_validate_before_commit_e2e -- --ignored
          cargo test -p sozu --locked ${{ matrix.flags }} --test listener_validate_before_commit_e2e -- --ignored
          cargo test -p sozu --locked ${{ matrix.flags }} --test sigterm_soft_stop_e2e -- --ignored

      # `sozu_top_e2e` adds the `tui` feature, so it runs on the `msrv-full`
      # cell only: that cell already resolves `tui` for `cargo doc
      # --all-features`, and one extra build of the `sozu` binary with it
      # covers the TUI's entry point. No controlling terminal is needed:
      # `sozu top --snapshot` takes no terminal control and renders
      # fixed-size frames to stdout (sozu#1574).
      - name: Test sozu top (process-level e2e)
        if: matrix.cell == 'msrv-full'
        run: cargo test -p sozu --locked ${{ matrix.flags }} --features tui --test sozu_top_e2e -- --include-ignored

      # `tests::fuzz_tests::*` is `#[ignore]`d here and exercised in
      # the dedicated `fuzz` job below. Skipping it keeps the e2e
      # step from rebuilding the fuzz/ crate under aws-lc-rs / fips
      # caches (cache key mismatch caused 30+ minute compile loops).
      - name: Test sozu-e2e
        run: "cargo test -p sozu-e2e --locked ${{ matrix.flags }} --verbose -- --skip tests::fuzz_tests::"

      # Criterion benches walk every `[[bench]]` in `lib/benches/`:
      # `crypto_provider`, `h2_scheduling`, `header_formatting`. The
      # full set runs per provider so handshake / pseudo-header /
      # cert-load regressions show up in any direction.
      - name: Bench (Criterion)
        if: matrix.bench
        run: cargo bench -p sozu-lib ${{ matrix.flags }}

      - name: Upload Criterion report
        if: always() && matrix.bench
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: criterion-${{ matrix.cell }}
          path: target/criterion
          retention-days: 14

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group C — dedicated fuzz job (nightly toolchain, real fuzzing)│
  # └──────────────────────────────────────────────────────────────┘
  fuzz:
    name: Fuzz (nightly)
    runs-on: sozu-general
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: ci-fuzz
          workspaces: . -> target/

      # `+nightly` is REQUIRED here: the repo's `rust-toolchain` file pins
      # 1.93.1, and that directory override beats the nightly default installed
      # above. Without the explicit toolchain, `cargo install` runs under 1.93.1
      # and cargo-fuzz's locked dep tree (cargo-platform 0.3.3, rust-version
      # 1.91) fails the MSRV gate. The fuzz steps below use `cargo +nightly`.
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      # Budget: 4 × 300 s of fuzzing ≈ 20 min wall, PLUS each
      # `cargo +nightly fuzz run` first building its target (per-target
      # sanitizer builds, partially cold cache) and the toolchain +
      # cargo-fuzz install above — observed ~30 min total on a cold-ish
      # cache (run 29088526469 was cancelled at 30:16 mid-last-target),
      # hence the 45-min job timeout. cargo-fuzz writes crash artefacts
      # to `fuzz/artifacts/<target>/`, picked up by the upload step.
      - name: Fuzz fuzz_frame_parser (300s)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_frame_parser -- -max_total_time=300

      - name: Fuzz fuzz_hpack_decoder (300s)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_hpack_decoder -- -max_total_time=300

      - name: Fuzz fuzz_udp_flow (300s)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_udp_flow -- -max_total_time=300

      - name: Fuzz fuzz_tcp_clienthello (300s)
        working-directory: fuzz
        run: cargo +nightly fuzz run fuzz_tcp_clienthello -- -max_total_time=300

      - name: Upload fuzz crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          retention-days: 14

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group C′ — cargo audit: surface RUSTSEC advisories on the    │
  # │   whole workspace including the `tui` feature surface, which │
  # │   pulls 12 optional crates (color-eyre, crossterm, ratatui,  │
  # │   tui-input, tui-big-text, …) outside the default build's    │
  # │   coverage. Treats every advisory as a warning; the job      │
  # │   fails only on `--deny warnings` so a maintainer can react  │
  # │   before the next release lands.                              │
  # └──────────────────────────────────────────────────────────────┘
  cargo-audit:
    name: cargo audit
    runs-on: sozu-general
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: ci-audit
          workspaces: . -> target/

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (default features)
        run: cargo audit --deny warnings

      - name: Run cargo audit (all features incl. tui)
        run: |
          # `cargo audit` reads `Cargo.lock`, which already includes the
          # `tui`-feature transitive deps since this PR landed them as
          # workspace-locked entries. Re-running with the same lockfile
          # produces a consistent advisory set; the duplicate invocation
          # is kept symmetrical with the per-feature build matrix above.
          cargo audit --deny warnings

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group C″ — test hygiene: reject a bare `#[ignore]` (one with  │
  # │   no reason string). Per CONTRIBUTING.md / doc/testing.md,    │
  # │   `#[ignore]` must carry a reason and only gate an            │
  # │   environment dependency or a tracked follow-up — never hide  │
  # │   a failing test. Doc-comment mentions of `#[ignore]` (lines  │
  # │   starting with `//`) are excluded.                          │
  # └──────────────────────────────────────────────────────────────┘
  test-hygiene:
    name: Test hygiene
    runs-on: sozu-general
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Reject bare #[ignore] (must carry a reason string)
        run: |
          matches=$(grep -rEn '#\[ignore\]' --include='*.rs' . | grep -vE ':[[:space:]]*//' || true)
          if [ -n "$matches" ]; then
            echo "::error::bare #[ignore] without a reason string — use #[ignore = \"...\"] (see CONTRIBUTING.md#testing / doc/testing.md):"
            echo "$matches"
            exit 1
          fi
          echo "OK: every #[ignore] carries a reason string."
  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group C″ — documentation citation resolver                    │
  # │   Three rules read `doc/**` and every `**/LIFECYCLE.md`: a    │
  # │   `file.rs:NNN` / `file.md:NNN` citation must resolve to a    │
  # │   real, non-blank line; one this changeset did not touch must │
  # │   still name the same TEXT at the merge base; and a fenced    │
  # │   block that names the lines it quotes must quote them        │
  # │   literally. One more rule reads those plus every `*.rs` and  │
  # │   CHANGELOG.md: a cited test name must name a `fn`. A fifth   │
  # │   reads every `*.rs` alone and FORBIDS rather than resolves:  │
  # │   no `file.rs:NNN` in a `//`, `///` or `//!` comment.         │
  # │                                                               │
  # │   .github/scripts/check_doc_citations.py IS the authority.    │
  # │   Its header carries every rule, the measurement behind it    │
  # │   and the issue it came from; doc/README.md carries the       │
  # │   convention for authors. Both were updated when the          │
  # │   pinned-block rule shipped and this box was not, so keep it  │
  # │   to one clause per rule and the pointer: if a rule CHANGES,  │
  # │   change the script and leave this alone; if one is ADDED,    │
  # │   add a clause. Each step below documents its own wiring,     │
  # │   which is why none of it is repeated up here.                │
  # │                                                               │
  # │   It runs on the merge result, which is the point: the pull   │
  # │   request that breaks a citation is almost never the one that │
  # │   contains it, so no reviewer is ever shown both halves.      │
  # └──────────────────────────────────────────────────────────────┘
  doc-citations:
    name: Doc citations
    runs-on: sozu-general
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The drifted-citation rule reads each cited line at the merge base
          # as well as at HEAD, so the base commit has to be in the object
          # store. The default shallow checkout leaves it out entirely, and the
          # rule refuses to run rather than reporting a clean comparison of
          # nothing. Pull requests here stack on each other, so the base is
          # often not `main` and no narrower fetch covers every case.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Quoted: unquoted YAML reads this as a float, which would turn a
          # future "3.10" into 3.1.
          python-version: "3.12"

      - name: Self-test the resolver against its broken fixture
        run: python3 .github/scripts/check_doc_citations.py --self-test

      # Reporting a failure and acting on it are two different lines of code.
      # A build of the resolver that printed every failure and still exited 0
      # would pass the self-test above and the real run below, so assert the
      # exit code itself against a tree that is known to be broken.
      - name: The resolver must exit 1, reporting failures, on the broken fixture tree
        run: |
          set +e
          out=$(python3 .github/scripts/check_doc_citations.py --root .github/scripts/testdata/citations 2>&1)
          code=$?
          set -e
          echo "$out"
          # Exit 1 alone is not enough: an uncaught exception exits 1 too and
          # would read as a healthy refusal. Require the failure report with it.
          if [ "$code" -ne 1 ] || ! printf '%s' "$out" | grep -q 'do not resolve'; then
            echo "::error::expected exit 1 and a failure report from the deliberately broken fixture tree, got exit $code"
            exit 1
          fi
          echo "OK: the resolver exits 1 and reports failures on the broken fixture tree."

      - name: Resolve every citation, report every one that drifted, and every cited test name
        # The base revision arrives through the environment, never interpolated
        # into the shell, and it is a commit sha rather than free text. On a
        # `pull_request` the event always carries one; a `main` or tag push has
        # no changeset to compare against, so the script says on its own line
        # that the drift rule did not run instead of implying it passed.
        env:
          CITATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -z "$CITATION_BASE" ]; then
            echo "::error::this pull request carries no base sha, so the drifted-citation rule would not run"
            exit 1
          fi
          if [ -n "$CITATION_BASE" ]; then
            python3 .github/scripts/check_doc_citations.py --base "$CITATION_BASE"
          else
            python3 .github/scripts/check_doc_citations.py
          fi


  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group C‴ — moonpool-sim deterministic simulations (UDP core + │
  # │   TCP passthrough SNI-preread core, sozu-proxy/sozu#1279).    │
  # │   The sozu-sim harness is cfg-gated off in the main matrix    │
  # │   (no tokio_unstable), so run MODEST seeded sweeps here with   │
  # │   the flag as the per-PR gate; the deep swarms run nightly     │
  # │   (simulation-sweep.yml). Debug build keeps the in-core        │
  # │   `debug_assert!` invariants live.                             │
  # └──────────────────────────────────────────────────────────────┘
  udp-simulation:
    name: UDP simulation (moonpool)
    runs-on: sozu-general
    timeout-minutes: 30
    env:
      # Scopes the unstable flag to THIS job; cfg-gated deps mean the rest of the
      # workspace (and the main test matrix) never sets it.
      RUSTFLAGS: '--cfg tokio_unstable'
      # Modest per-PR sweep — moonpool builds a fresh tokio runtime per seed
      # (~100x slower per seed-step than a pure loop); the nightly job goes deep.
      SOZU_UDP_SIM_SEEDS: '64'
      SOZU_UDP_SIM_STEPS: '2000'
      # tcp_preread_sim has no per-seed tokio runtime (SniPrereadCore is a
      # small, near-stateless per-connection state machine, not a long-lived
      # flow table), so it is far cheaper per seed than the UDP sim — a
      # locally measured 2048 seeds × 200 connections/seed runs in ~14s.
      # Still kept modest here on principle; the nightly job goes deeper.
      SOZU_TCP_PREREAD_SIM_SEEDS: '512'
      SOZU_TCP_PREREAD_SIM_STEPS: '64'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Cache cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: sim-pr
          workspaces: . -> target/

      - name: UDP simulation sweep (debug, asserts live)
        run: cargo test -p sozu-sim --locked --test udp_simulation -- --nocapture

      - name: TCP preread simulation sweep (debug, asserts live)
        run: cargo test -p sozu-sim --locked --test tcp_preread_sim -- --nocapture

      - name: H2 core simulation sweep (debug, asserts live)
        run: cargo test -p sozu-sim --locked --test h2_simulation -- --nocapture

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group D — Bombardier load benches (folded from benchmark.yml) │
  # └──────────────────────────────────────────────────────────────┘
  build-bombardier:
    name: Build bombardier
    # Produces a linux/amd64 binary, consumable by bench-bombardier below: both scale sets pin the
    # same runner image digest, so a sozu-general build runs on a sozu-bench node unchanged. (This
    # comment used to say bench-bombardier "stays on ubuntu-latest"; that stopped being true with
    # the 2026-09-23 full-matrix migration to the self-hosted CKE runners.)
    runs-on: sozu-general
    steps:
      - name: Clone bombardier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: codesenberg/bombardier
          path: .

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: false

      - name: Build bombardier
        run: go build -o bombardier

      - name: Upload bombardier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bombardier
          path: bombardier

  build-lagging_server:
    name: Build lagging_server
    runs-on: sozu-general
    steps:
      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Clone lagging_server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: CleverCloud/lagging_server
          path: .

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: lagging_server

      - name: Build lagging_server
        run: cargo build --release

      - name: Upload lagging_server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: lagging_server
          path: target/release/lagging_server

  build-bench-logger:
    name: Build bench_logger
    runs-on: sozu-general
    steps:
      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This job's own cache. NOTE: the `ci-crypto-ring` prefix does NOT restore the crypto-ring
      # pipeline cell's cache, despite what this comment claimed before. Swatinem/rust-cache puts
      # `GITHUB_JOB` in the key unless `shared-key` is set (`add-job-id-key` defaults to true), so
      # the key here is `ci-crypto-ring-build-bench-logger-…`, distinct from
      # `ci-crypto-ring-pipeline-…`. The prefix is kept only so the key stays stable across runs;
      # changing it would just discard the existing entry. Use `shared-key` to share for real.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: ci-crypto-ring

      - name: Build bench_logger
        run: cargo build --release --example bench_logger

      - name: Upload bench_logger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bench_logger
          path: target/release/examples/bench_logger

  # Each provider's release `sozu` is compiled ONCE here and handed to the bench jobs as an
  # artifact, the same shape `build-bombardier`, `build-lagging_server` and `build-bench-logger`
  # above already use. `bench-bombardier` used to run this exact `cargo build` inside each of its
  # four cells, on a bench node, AFTER `needs: [pipeline]` was satisfied — so 258-314 s of
  # compilation per cell (measured, run 35923383722, on the pre-2026-09-24 XL bench nodes; expect
  # roughly double on the 7 vCPU pods #1476 moved to) sat on the critical path behind a ~2700 s
  # pipeline matrix. Pipeline cells shrank by the same ratio, so what matters is the ratio, not
  # the absolute number. With no `needs:` this job starts at t=0 and finishes inside that shadow.
  #
  # This relocates compilation, it does not remove any: the same four provider configurations are
  # still compiled once each per run, with the same crate, profile, toolchain and features, so the
  # same diagnostics are still emitted. The `run:` line below is byte-identical to the one it
  # replaced; keep it that way.
  build-sozu:
    name: Build sozu (${{ matrix.provider }})
    # sozu-general, NOT sozu-bench. The bench pool is a deliberately PINNED, non-autoscaling set of
    # nodes sized for the bench fan-out, running one job per pod per node so a benchmark never
    # shares hardware (ci/runners/arc/values-bench.yaml); general autoscales behind it. Spending
    # that fixed capacity on a compile is what this job exists to stop, and a compile co-scheduled
    # with the crypto cells' `Bench (Criterion)` step is exactly the LLC/DRAM-bandwidth
    # interference the pool is designed to exclude. Nothing is lost by moving: since the
    # 2026-09-24 redesign both scale sets request the same 7 vCPU / 10Gi per pod, so the build is
    # no slower here, and both pin the same runner image digest, so the binary runs on a bench node
    # unchanged — `lagging_server` and `bombardier` already cross that boundary the same way.
    runs-on: sozu-general
    strategy:
      fail-fast: false
      matrix:
        provider:
          - crypto-ring
          - crypto-aws-lc-rs
          - crypto-openssl
          - fips
    steps:
      - name: Install rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This job's OWN cache, deliberately not keyed `ci-<provider>`. Swatinem/rust-cache composes
      # its key as `<prefix-key>-<GITHUB_JOB>-<os>-<arch>-<env hash>-<lockfile hash>`:
      # `add-job-id-key` defaults to true and no `shared-key` is set anywhere in this file, so a
      # `prefix-key` borrowed from another job NEVER restores that job's cache — it only makes the
      # key look shared. Verified against the pinned action source and against the repository's
      # live cache listing, which carries one entry per job id (`ci-fips-bench-bombardier-…`,
      # `ci-msrv-full-pipeline-…`). The `release` in the prefix is there so nobody re-reads this
      # as pipeline sharing. To make two jobs genuinely share one cache you must set `shared-key`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: ci-release-${{ matrix.provider }}

      - name: Build sozu (release, ${{ matrix.provider }})
        run: cargo build --release -p sozu --no-default-features --features jemallocator,${{ matrix.provider }}

      - name: Upload sozu
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sozu-${{ matrix.provider }}
          path: target/release/sozu

  bench-bombardier:
    name: Bombardier bench (${{ matrix.provider }})
    # Migrated 2026-09-23: the former "Host mapping sozu.io domains" step (`sudo tee -a
    # /etc/hosts`) is replaced by the hostAliases sozu.io block in values-bench.yaml. The per-run
    # generated self-signed certs are trusted via SSL_CERT_FILE (Go's crypto/x509 honors it on
    # Linux) instead of `sudo update-ca-certificates` — see "Build local CA bundle for bombardier"
    # and "Launch bench" below. No sudo usage left in this job.
    runs-on: sozu-bench
    needs: [pipeline, build-sozu, build-bombardier, build-lagging_server]
    strategy:
      fail-fast: false
      matrix:
        provider:
          - crypto-ring
          - crypto-aws-lc-rs
          - crypto-openssl
          - fips
    # No Rust toolchain and no cargo cache here: `build-sozu` above compiles this provider's
    # release binary once, off the critical path, and this job downloads it. A bench node is a
    # dedicated machine from a fixed pool, held for the whole job (ci/runners/arc/values-bench.yaml);
    # it should be running bench.py, not a compiler. `needs: build-sozu` costs nothing in
    # wall-clock — that job has no `needs:` of its own and finishes long before the ~2700 s
    # pipeline matrix this job already waits on.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download sozu
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sozu-${{ matrix.provider }}
          path: .github/workflows

      - name: Download bombardier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: bombardier
          path: .github/workflows

      - name: Download lagging_server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: lagging_server
          path: .github/workflows

      - name: Generate TLS key rsa 2048
        working-directory: .github/workflows
        run: |
          openssl req -newkey rsa:2048 -nodes -keyout rsa-2048.key -out rsa-2048.csr -config rsa-2048.cnf
          openssl x509 -req -days 365 -in rsa-2048.csr -signkey rsa-2048.key -out rsa-2048.pem -extensions req_ext -extfile rsa-2048.cnf
          openssl x509 -in rsa-2048.pem -noout -checkhost rsa-2048.sozu.io

      - name: Generate TLS key rsa 4096
        working-directory: .github/workflows
        run: |
          openssl req -newkey rsa:4096 -nodes -keyout rsa-4096.key -out rsa-4096.csr -config rsa-4096.cnf
          openssl x509 -req -days 365 -in rsa-4096.csr -signkey rsa-4096.key -out rsa-4096.pem -extensions req_ext -extfile rsa-4096.cnf
          openssl x509 -in rsa-4096.pem -noout -checkhost rsa-4096.sozu.io

      - name: Generate TLS key ecdsa
        working-directory: .github/workflows
        run: |
          openssl ecparam -name prime256v1 -genkey -out ecdsa.key
          openssl req -new -key ecdsa.key -out ecdsa.csr -config ecdsa.cnf
          openssl x509 -req -days 365 -in ecdsa.csr -signkey ecdsa.key -out ecdsa.pem -extensions req_ext -extfile ecdsa.cnf
          openssl x509 -in ecdsa.pem -noout -checkhost ecdsa.sozu.io

      # Trust the three self-signed certs above via SSL_CERT_FILE (Go's crypto/x509 honors it on
      # Linux) instead of installing them into the system CA store — the hardened pod's dropped
      # capabilities correctly block `sudo update-ca-certificates`. Each cert is self-signed (its
      # own CA), so bundling the three leaf certs together is sufficient.
      - name: Build local CA bundle for bombardier
        working-directory: .github/workflows
        run: cat rsa-2048.pem rsa-4096.pem ecdsa.pem > sozu-bench-ca-bundle.pem

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.12

      - name: Fix rights
        working-directory: .github/workflows
        run: |
          chmod +x bombardier
          chmod +x lagging_server
          chmod +x sozu

      - name: Launch bench
        working-directory: .github/workflows
        env:
          SSL_CERT_FILE: ${{ github.workspace }}/.github/workflows/sozu-bench-ca-bundle.pem
        run: python bench.py

  bench-logs:
    name: Bench logger
    # Migrated 2026-09-23: a real benchmark (logging overhead), so it belongs on sozu-bench for
    # the same physical-node-exclusivity reason as bench-bombardier above — no sudo/etc-hosts/CA
    # dependency here (unlike bench-bombardier), so nothing blocks it under the hardened pod.
    runs-on: sozu-bench
    needs: [pipeline, build-bench-logger]
    # No Rust toolchain, no cargo cache and no `sozu` build in this job, deliberately.
    # `bench_logs.py` runs `./bench_logger` and nothing else, and `command/examples/bench_logger.rs`
    # only calls `sozu_command_lib::logging::setup_logging` — it never spawns, execs or connects to
    # a proxy. The release `sozu` this job used to build and stage was therefore never executed by
    # the benchmark: 402 s of compiling plus 79 s of cache upload for a 5 s benchmark (measured on
    # run 35923383722). Nothing stopped being verified when it went: `Bombardier bench
    # (crypto-ring)` compiles the byte-identical `-p sozu --no-default-features --features
    # jemallocator,crypto-ring` in the same run, so that configuration still gets its compile and
    # its diagnostics. Do not reintroduce a build here — give the binary to bench.py's job instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download bench_logger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: bench_logger
          path: .github/workflows

      - name: Fix rights
        working-directory: .github/workflows
        run: chmod +x bench_logger

      # ubuntu-latest carries Python preinstalled; the runner image doesn't (deliberately kept
      # Rust/C-toolchain-focused). Same pattern already used by bench-bombardier and doc-citations.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.12

      - name: Bench logs
        working-directory: .github/workflows
        run: python bench_logs.py

  # ┌──────────────────────────────────────────────────────────────┐
  # │ Group E — Docker validation and main publication              │
  # └──────────────────────────────────────────────────────────────┘
  dockerhub:
    name: Docker build and push to Docker Hub
    # Tag pushes are handled by `.github/workflows/release.yml`, which
    # publishes `clevercloud/sozu:${VERSION}` and `:latest` (stable tags
    # only). Pull requests still validate the complete Docker build, but
    # registry authentication and the `:${SHA}` push are restricted to
    # publication-triggering pushes on `main`.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: clevercloud/sozu:${{ github.sha }}
...
