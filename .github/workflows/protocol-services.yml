---
name: Real protocol services

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: 'Optional decimal seed; an omitted seed is derived from the commit SHA'
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
  SOZU_FEATURE_MATRIX_TOOLCHAIN: path

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Generate bounded service matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      seed: ${{ steps.matrix.outputs.seed }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate deterministic matrix
        id: matrix
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
        run: |
          if [[ -n "$REQUESTED_SEED" ]]; then
            seed="$REQUESTED_SEED"
          else
            seed="$((16#${GITHUB_SHA:0:15}))"
          fi
          matrix="$(python3 .github/scripts/feature_matrix.py --seed "$seed" matrix services)"
          printf 'seed=%s\n' "$seed" >> "$GITHUB_OUTPUT"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  protocol-service:
    name: ${{ matrix.service }} / ${{ matrix.config_id }} through Sōzu
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SOZU_CONTAINER_ENGINE: docker
      SOZU_PROTOCOL_SERVICE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.service }}-${{ matrix.config_id }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          cache-all-crates: true
          prefix-key: protocol-service-${{ matrix.service }}-${{ matrix.config_id }}
          workspaces: . -> target/

      - name: Verify container server
        run: docker info --format '{{.ID}}|{{.Name}}|{{.ServerVersion}}'

      - name: Exercise real service through Sōzu
        env:
          STATE_DIR: ${{ runner.temp }}/sozu-service-swarm/${{ matrix.service }}-${{ matrix.config_id }}
          SOZU_PROTOCOL_SERVICE_ARTIFACT_DIR: ${{ runner.temp }}/sozu-protocol-services/${{ matrix.service }}-${{ matrix.config_id }}
        run: |
          mkdir -p "$STATE_DIR" "$SOZU_PROTOCOL_SERVICE_ARTIFACT_DIR"
          python3 .github/scripts/run_feature_matrix.py \
            --mode bounded \
            --seed '${{ needs.plan.outputs.seed }}' \
            --repo-root . \
            --state-dir "$STATE_DIR" \
            --cell '${{ matrix.cell_id }}' \
            --suites services \
            --jobs 4 > "$STATE_DIR/command-output.json" || status=$?
          cat "$STATE_DIR/command-output.json"
          exit "${status:-0}"

      - name: Collect and remove only this cell's containers
        if: always()
        env:
          SOZU_PROTOCOL_SERVICE_ARTIFACT_DIR: ${{ runner.temp }}/sozu-protocol-services/${{ matrix.service }}-${{ matrix.config_id }}
        run: |
          set -o pipefail
          mkdir -p "$SOZU_PROTOCOL_SERVICE_ARTIFACT_DIR"
          # The runner labels each attempt's containers with
          # "$SOZU_PROTOCOL_SERVICE_RUN_ID-<attempt id>", so match the prefix.
          owned() {
            docker ps -a --filter label=org.sozu.e2e.run \
              --format '{{.ID}} {{.Label "org.sozu.e2e.run"}}' \
              | awk -v run="$SOZU_PROTOCOL_SERVICE_RUN_ID" \
                  '$2 == run || index($2, run "-") == 1 { print $1 }'
          }
          mapfile -t ids < <(owned)
          for id in "${ids[@]}"; do
            docker logs "$id" \
              > "$SOZU_PROTOCOL_SERVICE_ARTIFACT_DIR/$id.log" 2>&1 || true
            docker rm --volumes --force "$id"
          done
          remaining="$(owned)"
          test -z "$remaining"

      - name: Upload receipts and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: protocol-service-${{ matrix.service }}-${{ matrix.config_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sozu-service-swarm/${{ matrix.service }}-${{ matrix.config_id }}
            ${{ runner.temp }}/sozu-protocol-services/${{ matrix.service }}-${{ matrix.config_id }}
          if-no-files-found: error
          retention-days: 14
